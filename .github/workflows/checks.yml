name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - name: Test packaging helpers
        run: python3 -m unittest discover -s tests -v
      - name: Validate metadata and scripts
        run: |
          desktop-file-validate packaging/io.github.x_vlad_x.OrganicMapsGtk.desktop
          appstreamcli validate --strict --no-net packaging/io.github.x_vlad_x.OrganicMapsGtk.metainfo.xml
          bash -n tools/build-packages.sh tools/ci-build.sh update-organicmaps-gtk.sh
          sh -n packaging/AppRun packaging/organicmaps-gtk packaging/organicmaps-gtk-migrate-launcher
          python3 tools/ci_release.py check
          git diff --check
